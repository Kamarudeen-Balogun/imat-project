name: Ping sitemap

on:
  push:
    branches: [ "main" ]

jobs:
  ping-sitemap:
    name: Ping search engines with sitemap
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://imat-futa.vercel.app
    steps:
      - name: Ping Google and Bing
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set. Aborting."
            exit 1
          fi
          SITEMAP="${SITE_URL%/}/sitemap.xml"
          echo "Pinging sitemap: $SITEMAP"
          echo "Google response:"
          curl -sS --max-time 10 "https://www.google.com/ping?sitemap=${SITEMAP}" || true
          echo
          echo "Bing response:"
          curl -sS --max-time 10 "https://www.bing.com/ping?sitemap=${SITEMAP}" || true
